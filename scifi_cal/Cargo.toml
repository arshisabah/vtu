[package]
name = "scifi_cal"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.3"
panic-halt = "0.2.0"
stm32f1xx-hal = { version = "0.10.0", features = ["stm32f103", "rt"] }
heapless = "0.8.0"
nb = "1.1.0"
libm = "0.2.8"

[profile.release]
opt-level = "z"        # Optimize for size
lto = true             # Link-time optimization
codegen-units = 1      # Better optimization
debug = false          # Remove debug info in release
strip = true           # Strip symbols
panic = "abort"        # Smaller panic handler
overflow-checks = false # Disable overflow checks for smaller code

[profile.dev]
opt-level = 1
debug = true
lto = false
