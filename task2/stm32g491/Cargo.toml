[package]
name = "stm32g491-uart"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.3"
panic-halt = "0.2.0"
stm32g4 = { version = "0.15.1", features = ["stm32g491", "rt"] }
heapless = "0.8.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
debug = true

[profile.dev]
opt-level = 1